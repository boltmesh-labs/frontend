repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=auto]
      - id: check-executables-have-shebangs
      - id: detect-private-key

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # --- ESLint ---
      - id: eslint
        name: eslint
        entry: npx eslint --fix
        language: system
        types_or: [javascript, jsx, ts, tsx]

      # --- Prettier ---
      - id: prettier
        name: prettier
        # Left unpinned in the entry on purpose: this repo declares prettier as a
        # devDependency and pins its formatting in `.prettierrc`, so `npx`
        # resolving the local `node_modules/.bin/prettier` is already the pinned
        # version. Run `npm ci` first, or `npx` will silently fall back to
        # fetching the latest release instead.
        entry: npx prettier --write
        language: system
        types_or: [css, javascript, jsx, ts, tsx, json, yaml, html]

      # --- Markdown Lint ---
      - id: markdownlint
        name: markdownlint
        # Unlike prettier, markdownlint-cli2 is not a devDependency here, so
        # nothing else pins it: without a version in the entry the hook's
        # behavior depends on whatever npm served that hour. Pinned to match
        # the other boltmesh repos, which share this version because they also
        # share the engine (markdownlint 0.41.1) and .markdownlint.json.
        entry: npx --yes markdownlint-cli2@0.23.3 --fix
        language: system
        types: [markdown]
