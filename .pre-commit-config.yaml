repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=auto]
      - id: check-executables-have-shebangs
      - id: detect-private-key

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # --- ESLint ---
      - id: eslint
        name: eslint
        entry: npx eslint --fix
        language: system
        types_or: [javascript, jsx, ts, tsx]

      # --- Prettier ---
      - id: prettier
        name: prettier
        # Left unpinned in the entry on purpose: this repo declares prettier as a
        # devDependency and pins its formatting in `.prettierrc`, so `npx`
        # resolving the local `node_modules/.bin/prettier` is already the pinned
        # version. Run `npm ci` first, or `npx` will silently fall back to
        # fetching the latest release instead.
        entry: npx prettier --write
        language: system
        types_or: [css, javascript, jsx, ts, tsx, json, yaml, html]

      # --- Markdown Lint ---
      - id: markdownlint
        name: markdownlint
        # Unlike prettier, markdownlint-cli2 is not a devDependency here, so
        # nothing else pins it: without a version in the entry the hook's
        # behavior depends on whatever npm served that hour. Pinned to match
        # the other boltmesh repos, which share this version because they also
        # share the engine (markdownlint 0.41.1) and .markdownlint.json.
        #
        # Both formatters deliberately cover the `.md` files in this repo:
        # prettier is the only *formatter* (it rewraps, via `npm run format`),
        # markdownlint the only *linter* (it reports MD rules prettier cannot
        # fix, e.g. MD033). The `pre-commit` CI job runs this one; `validate`
        # runs prettier through the locked `npm run format:check`.
        #
        # `language: node` with the pin in `additional_dependencies`, not an
        # `npx` entry. The version is still pinned to 0.23.3 and still resolves
        # the same tree, so the rules and .markdownlint.json are unchanged. The
        # difference is where that tree lives: `npx --yes` re-resolved and
        # re-downloaded all ~80 packages into `~/.npm/_npx` on every run, on
        # every machine, including CI, where nothing caches that directory. A
        # truncated extraction there (observed as a half-written
        # `katex/dist/katex.mjs`, which markdownlint pulls in via
        # micromark-extension-math) killed the hook with a bare ESM SyntaxError
        # before it read a file. pre-commit installs this tree once into
        # `~/.cache/pre-commit`, which the `pre-commit` CI job already caches
        # and restores, so the download happens on a cache miss rather than on
        # every run. This stays distinct from the devDependency-backed prettier
        # above: the point of `language: node` is the same isolation prettier
        # already gets from `node_modules`, without adding markdownlint-cli2 to
        # this repo's lockfile and the `format:check` chain that would follow.
        entry: markdownlint-cli2 --fix
        language: node
        additional_dependencies: ["markdownlint-cli2@0.23.3"]
        types: [markdown]
