# Shared security headers for every response.
#
# nginx does not inherit a parent `add_header` into a location that declares
# one of its own, so the SPA shell and the /assets/ cache policy each need this
# block explicitly. `include` is the only way to keep one copy: editing a
# header here reaches all three responses, where a copy-pasted block silently
# left the others permissive.
#
# The API origin is deployment-specific. Allow HTTPS cross-origin API calls
# (plus the local default); the API still enforces CORS independently.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https: http://localhost:*; font-src 'self' data:; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
