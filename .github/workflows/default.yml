name: "Frontend CI/CD"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # The hooks in `.pre-commit-config.yaml` are the repo's documented local gate
  # and are mostly not re-checked in CI. `validate` runs ESLint and Prettier
  # through the locked `npm run` scripts, and `security` runs `gitleaks`;
  # everything else in that file is covered by running the hooks locally, as
  # documented in CONTRIBUTING.md.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Run Tests
        run: npm run test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run mocked End-to-End Tests
        run: npm run test:e2e:mocked

      - name: Run production bundle smoke test
        run: npm run test:e2e:production

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and verify production environment
        env:
          VITE_API_URL: https://api.ci.example/v1
          VITE_APP_COMPANY_NAME: CI BoltMesh
          VITE_APP_SUPPORT_EMAIL: ci-support@example.com
        run: |
          npm run build
          grep -RqsF "$VITE_API_URL" dist
          grep -RqsF "$VITE_APP_COMPANY_NAME" dist
          grep -RqsF "$VITE_APP_SUPPORT_EMAIL" dist
          ! grep -RqsF '%VITE_APP_COMPANY_NAME%' dist

  security:
    name: "Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Full history: gitleaks scans commits rather than the working tree, so a
      # secret committed earlier and deleted later is still caught. The local hook
      # structurally cannot see that case, because it only ever looks at staged
      # files. `version` matches the pinned hook rev. Runs before Trivy so a leak
      # fails the job without also paying for the filesystem scan.
      # The OSS container, not `gitleaks/gitleaks-action`: v3 requires a paid
      # GITLEAKS_LICENSE for organisation-owned repos, and v2 runs on Node 20,
      # which GitHub removed from hosted runners on 2026-09-16. The container is
      # the same v8.30.1 binary the local hook pins, so the two agree.
      #
      # `git` scans commit history, which is the point -- a secret committed and
      # later deleted is still caught, and the local hook cannot see that case
      # because it runs `--staged`. `.gitleaksignore` grandfathers four
      # `generic-api-key` false positives (synthetic e2e JWTs and since-removed
      # e2e placeholders), fingerprint by fingerprint, so a real secret added
      # there later still fails.
      # The container runs as root while the workspace is owned by the runner
      # user, so git refuses the repo as "dubious ownership" and scans nothing
      # -- it still exits 0, so this fails silently. Mark the workspace safe via
      # the environment rather than a config file, so it lands inside the
      # container: `GIT_CONFIG_COUNT` is read by git itself and needs no
      # writable HOME.
      - name: Scan for committed secrets
        uses: docker://zricethezav/gitleaks:v8.30.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
        with:
          args: git --redact --no-banner --verbose --exit-code 1 .

      - name: Run Trivy Filesystem Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          format: "table"
          ignore-unfixed: true
          severity: "CRITICAL"
          exit-code: "1"

