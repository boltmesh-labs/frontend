name: "Frontend CI/CD"

# Security and the locked lint/format gate only. The heavy checks (Vitest, the
# mocked and production Playwright suites, and the production-bundle assertions)
# are a manual local gate documented in CONTRIBUTING.md: downloading Playwright
# browsers cost gigabytes per run and the failure artifacts shared the account's
# Actions storage allowance with everything else. Nothing here re-runs them.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # The hooks in `.pre-commit-config.yaml` are the repo's documented local gate.
  # `validate` still re-checks ESLint and Prettier through the locked `npm run`
  # scripts, because they are cheap and catch a bypassed hook; the tests and
  # end-to-end suites below are manual. `security` runs `gitleaks` and Trivy.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The container, not the `actionlint` pre-commit hook: the hook is
      # `language: golang`, so running it needs a Go toolchain. Pinned to the same
      # v1.7.12 as the hook rev. `GIT_CONFIG_COUNT` marks the workspace safe
      # because the container runs as root while the workspace belongs to the
      # runner user; actionlint walks up looking for the git root and without
      # this it reports "no project was found" and checks nothing.
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"

      # No `cache:` here: `setup-node`'s `cache` input names a package manager,
      # so caching is disabled by omitting it. The npm cache is keyed by
      # package-lock.json, so every dependency change left another entry in the
      # account's shared storage allowance. `npm ci` per run instead.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

  security:
    name: "Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Full history: gitleaks scans commits rather than the working tree, so a
      # secret committed earlier and deleted later is still caught. The local hook
      # structurally cannot see that case, because it only ever looks at staged
      # files. `version` matches the pinned hook rev. Runs before Trivy so a leak
      # fails the job without also paying for the filesystem scan.
      # The OSS container, not `gitleaks/gitleaks-action`: v3 requires a paid
      # GITLEAKS_LICENSE for organisation-owned repos, and v2 runs on Node 20,
      # which GitHub removed from hosted runners on 2026-09-16. The container is
      # the same v8.30.1 binary the local hook pins, so the two agree.
      #
      # `git` scans commit history, which is the point -- a secret committed and
      # later deleted is still caught, and the local hook cannot see that case
      # because it runs `--staged`. `.gitleaksignore` grandfathers four
      # `generic-api-key` false positives (synthetic e2e JWTs and since-removed
      # e2e placeholders), fingerprint by fingerprint, so a real secret added
      # there later still fails.
      # The container runs as root while the workspace is owned by the runner
      # user, so git refuses the repo as "dubious ownership" and scans nothing
      # -- it still exits 0, so this fails silently. Mark the workspace safe via
      # the environment rather than a config file, so it lands inside the
      # container: `GIT_CONFIG_COUNT` is read by git itself and needs no
      # writable HOME.
      - name: Scan for committed secrets
        uses: docker://zricethezav/gitleaks:v8.30.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
        with:
          args: git --redact --no-banner --verbose --exit-code 1 .

      # Trivy's built-in DB caching (on by default) keys the vulnerability DB by
      # date, so every day of CI left behind another ~90 MB entry that nothing
      # evicts -- and a PR whose key differs gets its own copy, since caches are
      # scoped per ref. Those entries filled the account's shared Actions
      # storage allowance, which blocks artifact uploads account-wide. Re-pull
      # the DB per run instead.
      - name: Run Trivy Filesystem Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          format: "table"
          ignore-unfixed: true
          severity: "CRITICAL"
          exit-code: "1"
          cache: "false"

