name: "Frontend CI/CD"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # The hooks in `.pre-commit-config.yaml` are the repo's documented local
  # gate, and the tool-free ones run here so a hook added to that file is
  # enforced in CI without editing this workflow. eslint and prettier resolve
  # the *local* devDependencies, so they need an `npm ci` this job deliberately
  # does not run -- `validate` checks both through the locked `npm run` scripts
  # instead. markdownlint is `npx --yes` against a pinned version, so it is
  # self-contained and does run here.
  pre-commit:
    name: "Pre-commit hooks"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # The upstream `actionlint` and `gitleaks` hooks are `language: golang`,
      # so pre-commit compiles them and needs a toolchain to do so. Pinning it
      # keeps that build reproducible.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      - name: Run pre-commit on all files
        uses: pre-commit/action@v3.0.1
        # Everything skipped here is enforced by the `validate` job running the
        # same command (`npm run lint`, `npm run format:check`), so this job
        # stays a fast gate:
        #   eslint, prettier
        # What remains runs against no repo toolchain at all: the
        # pre-commit-hooks hygiene guards, actionlint, gitleaks and
        # markdownlint. node (for the npx hook) comes from the ubuntu-latest
        # image.
        env:
          SKIP: >-
            eslint,prettier

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Run Tests
        run: npm run test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run mocked End-to-End Tests
        run: npm run test:e2e:mocked

      - name: Run production bundle smoke test
        run: npm run test:e2e:production

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and verify production environment
        env:
          VITE_API_URL: https://api.ci.example/v1
          VITE_APP_COMPANY_NAME: CI BoltMesh
          VITE_APP_SUPPORT_EMAIL: ci-support@example.com
        run: |
          npm run build
          grep -RqsF "$VITE_API_URL" dist
          grep -RqsF "$VITE_APP_COMPANY_NAME" dist
          grep -RqsF "$VITE_APP_SUPPORT_EMAIL" dist
          ! grep -RqsF '%VITE_APP_COMPANY_NAME%' dist

  security:
    name: "Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Trivy Filesystem Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          format: "table"
          ignore-unfixed: true
          severity: "CRITICAL"
          exit-code: "1"

